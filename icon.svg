<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="dsh-astock">
  <title>A股涨跌评估</title>
  <defs>
    <linearGradient id="astock-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e33a34"/>
      <stop offset="1" stop-color="#b3251f"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#astock-bg)"/>
  <!-- 三条均线：短/中/长，全部上扬，表示多头排列 -->
  <path d="M11 44 L22 38 L32 41 L42 30 L53 22" fill="none" stroke="#ffffff" stroke-opacity=".42"
        stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M11 49 L22 45 L32 46 L42 38 L53 31" fill="none" stroke="#ffffff" stroke-opacity=".7"
        stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 主趋势线与端点：涨 -->
  <path d="M11 40 L21 33 L30 36 L41 24 L53 14" fill="none" stroke="#ffffff"
        stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="53" cy="14" r="5.2" fill="#ffffff"/>
  <circle cx="53" cy="14" r="2.1" fill="#d3302a"/>
</svg>
