name: CI

# 每次推送到 main 或发 PR 时跑：语法校验 → JSON 校验 → 导出校验 → 全量测试 → 打包验证
on:
  push:
    branches: [main]
    # 发 tag 时不重复跑 CI，交给 release.yml
    tags-ignore: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的旧运行自动取消，避免排队浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 1. 离线测试：不依赖任何外部接口，最快给出信号 ──────────────────────
  test-offline:
    name: Test (offline, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 是本插件声明的 engines 下限；20/22 是 LTS；24 探前向兼容
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax check (all source files)
        run: npm run lint:syntax

      - name: Validate JSON resources
        run: npm run verify:json

      - name: Verify plugin exports
        run: npm run verify:exports

      # 纯函数测试：评分引擎与板块评分，零网络依赖，必须全绿
      - name: Offline tests (pure functions)
        run: npm run test:offline

  # ── 2. 全量测试：含联网用例，网络不通时用例自身 skip 而非失败 ──────────
  test-full:
    name: Test (full, Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # 联网用例（腾讯/新浪/东财）在 runner 上可能不可达。
      # 测试内部用 isOnline() 探测后 t.skip，所以这里不会因为外网问题红。
      - name: Full test suite
        run: npm test

      - name: Summarize test results
        if: always()
        run: |
          echo "### 测试结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "全量测试已执行。联网用例在接口不可达时会自动 skip（见上方日志的 skipped 计数）。" >> $GITHUB_STEP_SUMMARY

  # ── 3. 打包验证：确保 npm 包里该有的文件都在、不该有的没混进去 ────────
  verify-pack:
    name: Verify package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # 用结构化校验脚本代替 grep 文本断言。
      #
      # 早先的写法是 `grep -q " $f " pack-output.txt`，在 CI 上必然失败：
      # npm pack 的文件清单按列宽动态对齐，文件名后面补若干空格，
      # 例如 `npm notice 8.8kB   index.js           `。
      # 单空格包裹匹配不上多空格，而列宽取决于最长文件名的长度——
      # 一旦新增长文件名，断言就会全红。
      #
      # scripts/verify-pack.mjs 改用 `npm pack --dry-run --json` 拿结构化
      # 文件列表，同时校验 package.json 自洽性（private / files / dsh 入口）。
      - name: Verify package contents
        run: node scripts/verify-pack.mjs

      - name: Pack summary
        if: always()
        run: |
          echo "### 打包内容" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npm pack --dry-run 2>&1 | grep -E 'npm notice [0-9]' >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ── 4. 全绿才允许后续发布（release.yml 复用此结论） ────────────────────
  ci-success:
    name: CI success
    needs: [test-offline, test-full, verify-pack]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.test-offline.result }}" != "success" ] || \
             [ "${{ needs.test-full.result }}" != "success" ] || \
             [ "${{ needs.verify-pack.result }}" != "success" ]; then
            echo "❌ 有 job 未通过"
            exit 1
          fi
          echo "✅ 全部通过"
