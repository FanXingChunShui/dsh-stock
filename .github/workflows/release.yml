name: Release

# 推送 v* tag 时触发：校验版本号 → 全量测试 → 打包 → 发布 npm → 建 GitHub Release
#
# 认证方式：npm Trusted Publishing（OIDC），**不需要任何 secret**。
#
# 为什么用 OIDC 而不是 NPM_TOKEN：
#   - 长期 token 是供应链攻击最想要的东西，泄露即等于发布权限
#   - OIDC 每次发布换一个短期凭证，用完即失效
#   - 附带 provenance 来源证明，用户可验证包确实来自本仓库
#
# 前置条件（在 npmjs.com 上一次性配置）：
#   1. 包必须**已经存在**于 npm —— npm 无法为不存在的包配置 trusted publisher。
#      所以首发必须手动执行一次 `npm publish`（见 RELEASING.md）
#   2. npmjs.com → 该包 → Settings → Trusted Publishers → Link a repository
#      Repository owner: FanXingChunShui
#      Repository name:  dsh-stock
#      Workflow filename: release.yml
#      Environment:      （留空，除非本项目配置了 GitHub Environment）
#   3. workflow 必须声明 id-token: write（下方已声明）
#   4. npm CLI ≥ 11.5.1（Node 自带的 npm 版本不够，下方有升级步骤）
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: '只跑校验与打包，不实际发布'
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # 建 GitHub Release 需要
  # npm publish --provenance 需要 OIDC 令牌来签发来源证明（SLSA provenance）。
  # 缺这个权限会直接报 "Provenance generation failed" 或 401。
  id-token: write

jobs:
  # ── 1. 发布前校验：版本号一致性 + 全量测试 ──────────────────────────────
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # tag 必须与 package.json 的 version 完全一致，否则发布出的版本号和 tag 对不上
      - name: Verify tag matches package.json version
        id: version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version=$PKG_VERSION" >> $GITHUB_OUTPUT
          echo "package.json version: $PKG_VERSION"

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            echo "git tag version: $TAG"
            if [ "$PKG_VERSION" != "$TAG" ]; then
              echo "❌ tag (v$TAG) 与 package.json ($PKG_VERSION) 版本不一致"
              echo "   请先把 package.json 的 version 改成 $TAG 再打 tag"
              exit 1
            fi
            echo "✅ 版本一致：$PKG_VERSION"
          else
            echo "手动触发，跳过 tag 一致性检查"
          fi

      - name: Verify private flag is false
        run: |
          PRIVATE=$(node -p "require('./package.json').private")
          if [ "$PRIVATE" != "false" ]; then
            echo "❌ package.json 的 private 必须是 false 才能发布，当前：$PRIVATE"
            exit 1
          fi
          echo "✅ 可发布"

      - name: Syntax check
        run: npm run lint:syntax

      - name: Validate JSON
        run: npm run verify:json

      - name: Verify exports
        run: npm run verify:exports

      # 发布前就校验打包内容，避免把残缺包推上 npm（npm 不允许覆盖已发布版本）
      - name: Verify package contents
        run: npm run verify:pack

      - name: Full test suite
        run: npm test

  # ── 2. 发布到 npm ──────────────────────────────────────────────────────
  publish-npm:
    name: Publish to npm
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance 签名必需
    # 手动触发且勾了 dry-run 时不发布
    if: github.event_name == 'push' || inputs.dry-run == false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # ⚠️ 不要设 registry-url：setup-node 会写一行
          #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          # 到 .npmrc。走 OIDC 时这个变量根本不存在，npm 会拿空 token 去认证
          # 并报 ENEEDAUTH / 401。OIDC 的身份由 npm CLI 自己完成，不需要 .npmrc。
          # registry 用默认的 https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # 用 OIDC 发布：不注入任何 token，npm 自己向 GitHub 换取短期凭证。
      #
      # ⚠️ 两个必须满足的条件，否则会 403 或 ENEEDAUTH：
      #   1. job 必须声明 id-token: write（下方 permissions 已声明）
      #   2. npm CLI ≥ 11.5.1 —— Node 22 自带的是 npm 10.x，不够
      - name: Upgrade npm for OIDC support
        run: |
          CURRENT=$(npm --version)
          echo "当前 npm: $CURRENT（OIDC 需要 ≥ 11.5.1）"
          npm install -g npm@11
          echo "升级后 npm: $(npm --version)"

      - name: Publish via trusted publishing (OIDC)
        shell: bash
        run: |
          # pipefail：`npm publish | tee` 的退出码是 tee 的，会把失败伪装成成功
          set -o pipefail
          # --provenance 在 OIDC 下是自然配套的：来源证明由同一个 OIDC 身份签发
          npm publish --access public --provenance 2>&1 | tee publish.log
        # 注意：这里**没有** NODE_AUTH_TOKEN —— 全靠 OIDC

      # 发布后再向 registry 查一次，确认包真的上线了。
      # 这是对「步骤成功 ≠ 发布成功」的兜底验证。
      #
      # ⚠️ 这一步在 v0.2.0 曾经误报失败：npm 发布其实成功了（registry 上能查到），
      # 但包刚发布时 CDN 节点还没同步，12 次 × 10 秒全部拿到 404。
      # 之后改成本地视角 + 缓存穿透双通道查询：
      #   - npm view 走 npm CLI 自己的解析与重试逻辑
      #   - curl 带 Cache-Control: no-cache 强制穿透 CDN 缓存
      # 任一成功即视为已上线。总等待时间也放宽到 5 分钟。
      - name: Confirm package is live on npm
        shell: bash
        run: |
          set -e
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "校验 $NAME@$VERSION 是否已上线 npm …"
          for i in $(seq 1 30); do
            # 通道 1：npm CLI（自带重试与 registry 配置）
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "✓ $NAME@$VERSION 已上线（npm view 确认）"
              exit 0
            fi
            # 通道 2：直接查 registry，带 no-cache 绕过 CDN
            CODE=$(curl -s -o /dev/null -w '%{http_code}' \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              "https://registry.npmjs.org/$NAME/$VERSION?t=$(date +%s)")
            if [ "$CODE" = "200" ]; then
              echo "✓ $NAME@$VERSION 已上线（registry 直接确认）"
              exit 0
            fi
            echo "  第 $i 次：npm view 未命中，registry 返回 $CODE，10 秒后重试"
            sleep 10
          done
          echo "::error::$NAME@$VERSION 在 npm registry 上查不到，发布可能未真正生效"
          exit 1

      - name: Publish summary
        run: |
          echo "### 已发布到 npm" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`dsh-stock-surf@${{ needs.preflight.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "安装：\`plugin_manager install_bundle\` 目标 \`dsh-stock-surf@${{ needs.preflight.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY

  # ── 3. 建 GitHub Release（附 tarball） ─────────────────────────────────
  github-release:
    name: Create GitHub Release
    needs: [preflight, publish-npm]
    runs-on: ubuntu-latest
    # 只要 preflight 通过就建 Release，不因为 npm 侧的校验失败而连带跳过。
    # 理由：Release 的价值在于把 tag 与构建产物留档，与 npm 是否可见是两件事。
    # v0.2.0 就是因为 publish-npm 的 CDN 误报失败，导致 Release 被 skip，
    # 而 npm 其实已经发布成功——两个产物只到了一个。
    if: |
      always() && github.event_name == 'push'
      && needs.preflight.result == 'success'
      && needs.publish-npm.result != 'cancelled'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 生成完整 changelog 需要历史

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build tarball
        id: pack
        run: |
          npm pack
          TARBALL=$(ls dsh-stock-surf-*.tgz | head -1)
          echo "tarball=$TARBALL" >> $GITHUB_OUTPUT
          echo "打包完成：$TARBALL"

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${{ needs.preflight.outputs.version }}"
          if [ -f CHANGELOG.md ] && grep -q "## \[$VERSION\]" CHANGELOG.md; then
            # 抽出当前版本那一节
            awk "/^## \[$VERSION\]/{flag=1;next}/^## \[/{flag=0}flag" CHANGELOG.md > release-notes.md
          else
            echo "版本 $VERSION" > release-notes.md
            echo "" >> release-notes.md
            git log --pretty=format:'- %s (%h)' $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo '')..HEAD >> release-notes.md 2>/dev/null || echo "- 首个版本" >> release-notes.md
          fi
          cat release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.preflight.outputs.version }}
          body_path: release-notes.md
          files: ${{ steps.pack.outputs.tarball }}
          draft: false
          prerelease: ${{ contains(needs.preflight.outputs.version, '-') }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 4. 发布结果汇总 ────────────────────────────────────────────────────
  summary:
    name: Release summary
    needs: [preflight, publish-npm, github-release]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report
        run: |
          echo "### 发布结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 步骤 | 结果 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 预检 | ${{ needs.preflight.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| npm 发布 | ${{ needs.publish-npm.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Release | ${{ needs.github-release.result }} |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.publish-npm.result }}" = "failure" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ npm 发布失败。常见原因：" >> $GITHUB_STEP_SUMMARY
            echo "- **包在 npm 上还不存在**——trusted publisher 只能配置到已存在的包上，首发需手动 publish" >> $GITHUB_STEP_SUMMARY
            echo "- npmjs.com 上未配置 Trusted Publisher（Settings → Trusted Publishers → Link a repository）" >> $GITHUB_STEP_SUMMARY
            echo "- 配置里的 Workflow filename 与本文件不一致（必须是 \`release.yml\`）" >> $GITHUB_STEP_SUMMARY
            echo "- npm CLI 版本 < 11.5.1（本 workflow 已自动升级，除非升级步骤失败）" >> $GITHUB_STEP_SUMMARY
            echo "- 该版本号已存在于 npm（npm 不允许覆盖已发布版本，需先改 version）" >> $GITHUB_STEP_SUMMARY
          fi
